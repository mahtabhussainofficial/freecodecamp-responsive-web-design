<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards Hand</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="playing-cards">
      <!-- Card 1: Ace of Hearts -->
      <div class="card red">
        <div class="left">A♥</div>
        <div class="middle">
          <span>♥</span>
        </div>
        <div class="right">A♥</div>
      </div>

      <!-- Card 2: King of Spades -->
      <div class="card black">
        <div class="left">K♠</div>
        <div class="middle">
          <span>♠</span>
        </div>
        <div class="right">K♠</div>
      </div>

      <!-- Card 3: 7 of Diamonds -->
      <div class="card red">
        <div class="left">7♦</div>
        <div class="middle">
          <span>♦</span>
        </div>
        <div class="right">7♦</div>
      </div>
    </main>
  </body>
</html>
